name: Weekly retrain

# Re-pulls all historical data and retrains the model from scratch.
#
# The scheduled trigger is intentionally DISABLED: the committed model is the
# source of truth, and a cloud retrain would produce a different model than the
# one trained locally, making the published prediction diverge from the
# maintainer's. Retrain locally with `python pipeline.py --refresh --retrain`
# and push the updated model/ + data/processed/ instead.
#
# Left as manual-only (workflow_dispatch) for the rare case you explicitly want
# a cloud retrain from the Actions tab.

on:
  workflow_dispatch:       # manual trigger only — see note above

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Restore FastF1 HTTP cache to avoid re-downloading everything from scratch
      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: fastf1-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-${{ runner.os }}-

      # Restore prediction history so recap works after retrain
      - name: Restore prediction history
        uses: actions/cache@v4
        with:
          path: model/prediction_history.json
          key: f1-prediction-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            f1-prediction-history-${{ runner.os }}-

      - name: Run pipeline (refresh data + retrain model)
        run: python pipeline.py --refresh --retrain --no-open
        env:
          PYTHONUNBUFFERED: "1"
          MPLCONFIGDIR: ${{ github.workspace }}/.matplotlib

      # Save updated model to cache so the 6-hourly workflow picks it up
      - name: Save retrained model
        uses: actions/cache/save@v4
        with:
          path: |
            model/xgb_f1_final.json
            model/xgb_top5_final.json
            model/xgb_ranker_final.json
            model/model_metadata.json
            model/optuna_best_params.json
            model/validation_history.json
            data/processed/
          key: f1-model-${{ hashFiles('src/**.py') }}-${{ github.run_id }}

      # --- Stage HTML for Pages ---
      - name: Prepare publish directory
        run: |
          mkdir -p public
          latest=$(ls -t predictions/*.html 2>/dev/null | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No prediction HTML produced — failing"
            exit 1
          fi
          cp "$latest" public/index.html
          cp predictions/*.html public/ 2>/dev/null || true
          ls -la public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: "Weekly retrain (${{ github.run_id }})"
